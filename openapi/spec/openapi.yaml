        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrandResponse"
    delete:
      tags:
      - brand-controller
      operationId: deleteBrand
      parameters:
      - name: id
        in: path
        required: true
