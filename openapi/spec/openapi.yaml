components:
  schemas:
    ApiError:
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    InterventionQuantitaRequest:
      type: object
      properties:
        interventionId:
          type: integer
          format: int64
        quantita:
          type: integer
          format: int32
          minimum: 1
      required:
      - interventionId
    UpdateRepairDetailsRequest:
      type: object
      properties:
        isPreventivo:
          type: boolean
        interventi:
          type: array
          items:
            $ref: "#/components/schemas/InterventionQuantitaRequest"
        dataConsegna:
          type: string
          format: date
        acconto:
          type: number
    InterventionQuantitaResponse:
      type: object
      properties:
        interventionId:
          type: integer
          format: int64
        nome:
          type: string
        prezzo:
          type: number
        quantita:
          type: integer
          format: int32
    RepairDetailsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        repairId:
          type: integer
          format: int64
        isPreventivo:
          type: boolean
        interventi:
          type: array
          items:
            $ref: "#/components/schemas/InterventionQuantitaResponse"
        dataConsegna:
          type: string
          format: date
        acconto:
          type: number
        messaggi:
          type: array
          items:
            $ref: "#/components/schemas/RepairMessageResponse"
    RepairMessageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        testo:
          type: string
        autore:
          type: string
        createdAt:
          type: string
          format: date-time
    UpdateRepairRequest:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
        stato:
          type: string
          enum:
          - NUOVO
          - IN_CORSO
          - PRONTO
          - CONSEGNATO
        statoRiparazione:
          type: string
          enum:
          - ACCETTATO
          - ANALISI_IN_CORSO
          - RIPARAZIONE_IN_CORSO
          - ATTESA_PEZZI_DI_RICAMBIO
          - IN_ATTESA_DI_PREVENTIVO
          - PREVENTIVO_NON_ACCETTATO
          - RIPARAZIONE_CONCLUSA
          - DISPOSITIVO_NON_RIPARABILE
      required:
      - customerId
    ColorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
      required:
      - id
      - nome
    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        indirizzo:
          type: string
        citta:
          type: string
        cap:
          type: string
        telefono:
          type: string
          minLength: 1
        telefonoSecondario:
          type: string
      required:
      - cognome
      - email
      - id
      - nome
      - telefono
    ModelResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        tipoDispositivo:
          type: string
          enum:
          - TELEFONO
          - TABLET
          - COMPUTER
        brandId:
          type: integer
          format: int64
        brandNome:
          type: string
          minLength: 1
      required:
      - brandId
      - brandNome
      - id
      - nome
      - tipoDispositivo
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/ModelResponse"
        color:
          $ref: "#/components/schemas/ColorResponse"
        capacita:
          type: string
        codiceUnlock:
          type: string
        sequenzaUnlock:
          type: array
          items:
            type: integer
            format: int32
        pin:
          type: string
        accessori:
          type: string
        contattoConLiquidi:
          type: boolean
        dispositivoNonTestabile:
          type: boolean
        acquistatoPressoDiNoi:
          type: boolean
        seriale:
          type: string
        imei:
          type: string
        codiceModello:
          type: string
        testDiagnostici:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        lasciatoInNegozio:
          type: boolean
      required:
      - color
      - id
      - model
    RepairResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        customer:
          $ref: "#/components/schemas/CustomerResponse"
        product:
