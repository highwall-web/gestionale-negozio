  /api/colors:
    get:
      tags:
      - color-controller
      operationId: getAllColors
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColorResponse"
    post:
      tags:
      - color-controller
      operationId: createColor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateColorRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColorResponse"
  /api/brands:
    get:
      tags:
      - brand-controller
      operationId: getAllBrands
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandResponse"
    post:
      tags:
      - brand-controller
      operationId: createBrand
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrandResponse"
  /api/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        "200":
          description: OK
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/users/me:
    get:
      tags:
      - user-controller
      operationId: getCurrentUser
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/products/search:
    get:
      tags:
      - product-controller
      operationId: searchProduct
      parameters:
      - name: modelNome
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
  /api/products/by-seriale/{seriale}:
    get:
      tags:
      - product-controller
      operationId: getProductBySeriale
      parameters:
      - name: seriale
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /api/products/by-imei/{imei}:
    get:
      tags:
      - product-controller
      operationId: getProductByImei
      parameters:
      - name: imei
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /api/models/search:
    get:
      tags:
      - model-controller
      operationId: searchModel
      parameters:
      - name: nome
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelResponse"
  /api/models/search/by-brand:
    get:
      tags:
      - model-controller
      operationId: searchModelByBrand
      parameters:
      - name: brandId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: nome
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelResponse"
  /api/models/by-name/{nome}:
    get:
      tags:
      - model-controller
      operationId: getModelByName
      parameters:
      - name: nome
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ModelResponse"
  /api/models/by-brand-id/{id}:
    get:
      tags:
      - model-controller
      operationId: getModelsByBrandId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelResponse"
  /api/health:
    get:
      tags:
      - health-check-controller
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/colors/search:
    get:
      tags:
      - color-controller
      operationId: searchColor
      parameters:
      - name: nome
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColorResponse"
  /api/colors/by-name/{nome}:
    get:
      tags:
      - color-controller
      operationId: getColorByName
      parameters:
      - name: nome
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColorResponse"
  /api/brands/search:
    get:
      tags:
      - brand-controller
      operationId: searchBrand
      parameters:
      - name: nome
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandResponse"
  /api/brands/by-name/{nome}:
    get:
      tags:
      - brand-controller
      operationId: getBrandByName
      parameters:
      - name: nome
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrandResponse"
components:
  schemas:
    UpdateProductRequest:
      type: object
      properties:
        brandNome:
          type: string
          minLength: 1
        modelNome:
          type: string
          minLength: 1
        colorNome:
          type: string
          minLength: 1
        capacita:
          type: string
        codiceUnlock:
          type: string
        sequenzaUnlock:
          type: array
          items:
            type: integer
            format: int32
        pin:
          type: string
        accessori:
          type: string
        contattoConLiquidi:
          type: boolean
        dispositivoNonTestabile:
          type: boolean
        acquistatoPressoDiNoi:
          type: boolean
        seriale:
          type: string
        imei:
          type: string
      required:
      - brandNome
      - colorNome
      - modelNome
    ColorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
      required:
      - id
      - nome
    ModelResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        brandId:
          type: integer
          format: int64
        brandNome:
          type: string
          minLength: 1
      required:
      - brandId
      - brandNome
      - id
      - nome
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/ModelResponse"
        color:
          $ref: "#/components/schemas/ColorResponse"
        capacita:
          type: string
        codiceUnlock:
          type: string
        sequenzaUnlock:
          type: array
          items:
            type: integer
            format: int32
        pin:
          type: string
        accessori:
          type: string
        contattoConLiquidi:
          type: boolean
        dispositivoNonTestabile:
          type: boolean
        acquistatoPressoDiNoi:
          type: boolean
        seriale:
          type: string
        imei:
          type: string
    UpdateModelRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        brandId:
          type: integer
          format: int64
      required:
      - brandId
      - nome
    UpdateCustomerRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        indirizzo:
          type: string
        citta:
          type: string
        cap:
          type: string
          pattern: "\\d{5}"
        telefono:
          type: string
          minLength: 1
        telefonoSecondario:
          type: string
      required:
      - cognome
      - email
      - nome
      - telefono
    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        indirizzo:
          type: string
        citta:
          type: string
        cap:
          type: string
        telefono:
          type: string
          minLength: 1
        telefonoSecondario:
          type: string
      required:
      - cognome
      - email
      - id
      - nome
      - telefono
    UpdateColorRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
      required:
      - nome
    UpdateBrandRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
      required:
      - nome
    BrandResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
      required:
      - id
      - nome
    CreateProductRequest:
      type: object
      properties:
        brandNome:
          type: string
          minLength: 1
        modelNome:
          type: string
          minLength: 1
        colorNome:
          type: string
          minLength: 1
        capacita:
          type: string
        codiceUnlock:
          type: string
        sequenzaUnlock:
          type: array
          items:
            type: integer
            format: int32
        pin:
          type: string
        accessori:
          type: string
        contattoConLiquidi:
          type: boolean
        dispositivoNonTestabile:
          type: boolean
        acquistatoPressoDiNoi:
          type: boolean
        seriale:
          type: string
        imei:
          type: string
      required:
      - brandNome
      - colorNome
      - modelNome
    CreateModelRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        brandId:
          type: integer
          format: int64
      required:
      - brandId
      - nome
    CreateCustomerRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        indirizzo:
          type: string
        citta:
          type: string
        cap:
          type: string
          pattern: "\\d{5}"
        telefono:
          type: string
          minLength: 1
        telefonoSecondario:
          type: string
      required:
      - cognome
      - email
      - nome
      - telefono
    CreateColorRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
      required:
      - nome
    CreateBrandRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
      required:
      - nome
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
      required:
      - accessToken
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        rememberMe:
          type: boolean
      required:
      - password
      - username
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - COMMESSO
        enabled:
          type: boolean
