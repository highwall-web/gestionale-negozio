            '*/*':
              schema:
                $ref: "#/components/schemas/ColorResponse"
    put:
      tags:
      - color-controller
      operationId: updateColor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateColorRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColorResponse"
    delete:
      tags:
      - color-controller
      operationId: deleteColor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/brands/{id}:
    get:
      tags:
      - brand-controller
      operationId: getBrandById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
