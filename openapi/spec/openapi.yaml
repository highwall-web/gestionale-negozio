components:
  schemas:
    ApiError:
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    StatoRiparazioneItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        colore:
          type: string
          minLength: 1
        position:
          type: integer
          format: int32
      required:
      - colore
      - id
      - nome
      - position
    UpdateStatoRiparazioneRequest:
      type: object
      properties:
        stati:
          type: array
          items:
            $ref: "#/components/schemas/StatoRiparazioneItem"
      required:
      - stati
    StatoRiparazioneResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        colore:
          type: string
          minLength: 1
        position:
          type: integer
          format: int32
      required:
      - colore
      - id
      - nome
      - position
    StatoRepairItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        colore:
          type: string
          minLength: 1
        position:
          type: integer
          format: int32
      required:
      - colore
      - id
      - nome
      - position
    UpdateStatoRepairRequest:
      type: object
      properties:
        stati:
          type: array
          items:
            $ref: "#/components/schemas/StatoRepairItem"
      required:
      - stati
    StatoRepairResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        colore:
          type: string
          minLength: 1
        position:
          type: integer
          format: int32
      required:
      - colore
      - id
      - nome
      - position
    UpdateRepairRequest:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        interventionIds:
          type: array
          items:
            type: integer
            format: int64
        commenti:
          type: string
        dataConsegna:
          type: string
          format: date
        tariffa:
          type: string
          enum:
          - STANDARD
          - EXPRESS
        acconto:
          type: number
        statoId:
          type: integer
          format: int64
        statoRiparazioneId:
          type: integer
          format: int64
      required:
      - customerId
      - productId
      - tariffa
    ColorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
      required:
      - id
      - nome
    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        cognome:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        indirizzo:
          type: string
        citta:
          type: string
        cap:
          type: string
        telefono:
          type: string
          minLength: 1
        telefonoSecondario:
          type: string
      required:
      - cognome
      - email
      - id
      - nome
      - telefono
    InterventionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        prezzo:
          type: number
        periodoGaranzia:
          type: integer
          format: int32
        cumulabile:
          type: boolean
      required:
      - id
      - nome
      - prezzo
    ModelResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 1
        brandId:
          type: integer
          format: int64
        brandNome:
          type: string
          minLength: 1
      required:
      - brandId
      - brandNome
      - id
      - nome
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/ModelResponse"
        color:
          $ref: "#/components/schemas/ColorResponse"
        capacita:
          type: string
        codiceUnlock:
          type: string
        sequenzaUnlock:
          type: array
          items:
            type: integer
            format: int32
        pin:
          type: string
        accessori:
          type: string
        contattoConLiquidi:
          type: boolean
        dispositivoNonTestabile:
          type: boolean
        acquistatoPressoDiNoi:
